<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <link rel="icon" type="image/x-icon" href="/color-amp/paint-brush.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jersey+25&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/9c9528a7c3.js"
      crossorigin="anonymous"
    ></script>

    <title>Color Amp</title>

    <style>
      #buttons-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      #saved-colors {
        display: none;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 16px;
        padding: 16px;
        margin-top: 16px;
        border: 3px solid color-mix(in srgb, var(--text-color), transparent 90%);
        background-color: color-mix(
          in srgb,
          var(--text-color),
          transparent 80%
        );
        border-radius: 5px;
      }

      .saved-color {
        padding: 16px;
        border-radius: 5px;
        flex: 0 0 calc(33.33% - 48px);
      }

      .saved-color p {
        margin: 0;
      }

      .rubber-button button {
        display: flex;
        justify-content: center;
        width: 100%;
        padding: 6px 12px;
        border-radius: 100px;
        font-size: 14px;
        font-family: "Roboto Mono", sans-serif;
        font-weight: 900;
        cursor: pointer;
      }

      .rubber-button.white button {
        color: #575757;
        border: 1px solid #e0e0e0;
        background: conic-gradient(
          from 180deg,
          #f0f0f0,
          #e0e0e0,
          #f0f0f0,
          #e0e0e0,
          #f0f0f0,
          #e0e0e0,
          #f0f0f0
        );
        box-shadow:
          0 0 2px rgba(255, 255, 255, 0.6),
          0 0 10px rgba(255, 255, 255, 0.3),
          0 0 30px rgba(255, 255, 255, 0.4),
          1px 2px 3px rgba(00, 00, 00, 0.3),
          0 0 12px rgba(00, 00, 00, 0.2);
      }

      .rubber-button.red button {
        color: #ffdbdb;
        border: 1px solid #ff7057;
        background: conic-gradient(
          from 180deg,
          #ff6b6b,
          #ff4747,
          #ff6b6b,
          #ff4747,
          #ff6b6b,
          #ff4747,
          #ff6b6b
        );
        box-shadow:
          0 0 2px rgba(255, 112, 112, 0.9),
          0 0 10px rgba(255, 112, 112, 0.6),
          0 0 30px rgba(255, 240, 240, 0.4),
          1px 2px 3px rgba(00, 00, 00, 0.3),
          0 0 12px rgba(00, 00, 00, 0.2);
      }

      .rubber-button p {
        margin: 0;
      }

      .glow-container {
        width: 100%;
        opacity: 0.9;
        border-radius: 8px;
        /* border: 2px solid color-mix(in srgb, var(--bg-color), transparent 1000%); */
        /* border: none; */

        background-color: #fff;
        box-sizing: border-box;
        /* Subtle colored rim */

        /* Layer 1: Sharp inner core glow */
        /* Layer 2: Medium bleed */
        /* Layer 3: Large, soft environmental glow */
        box-shadow:
          0 0 3px rgba(255, 255, 255, 0.6),
          0 0 20px rgba(255, 255, 255, 0.4),
          0 0 70px rgba(255, 255, 255, 0.4);
      }

      :root {
        --knob-size: 50px;
        --pointer-color: #e0e0e0;
        --text-color: #ccc;
      }

      body {
        color: var(--text-color);
        background-color: var(--bg-color, #1a1a1a);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 60px;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 40px 16px;
        font-family: "Roboto Mono", sans-serif;
        box-sizing: border-box;
      }

      #page-container {
        width: 100%;
        max-width: 900px;
        padding: 0;
        display: flex;
        flex-direction: column;
      }

      #nav {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        gap: 24px;
        padding: 16px;
        border: 3px solid color-mix(in srgb, var(--bg-color), transparent 70%);
        background-color: rgba(00, 00, 00, 0.85);
        border-radius: 5px;
      }

      #nav-left {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 24px;
      }

      #nav-right {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 24px;
      }

      .knob-container {
        text-align: center;
      }

      .knob {
        position: relative;
        width: var(--knob-size);
        height: var(--knob-size);
        background: conic-gradient(
          from 180deg,
          #333,
          #555,
          #333,
          #111,
          #333,
          #555,
          #333
        );
        border-radius: 50%;
        border: 4px solid #111;
        box-shadow: 0 0 16px rgba(0, 0, 0, 0.8);
        cursor: ns-resize;
        display: flex;
        justify-content: center;
        transform: rotate(-120deg);
        user-select: none;
        touch-action: none;
      }

      .pointer {
        position: absolute;
        top: 8px;
        width: 4px;
        height: 18px;
        background-color: var(--pointer-color);
        border-radius: 2px;
        z-index: 10;
      }

      .label {
        font-family: "Roboto Mono", sans-serif;
        color: #d0d0d0;
        margin-top: 16px;
        margin-bottom: 0;
        letter-spacing: 0.1px;
        font-weight: bold;
        font-size: 0.9rem;
      }

      #color-readouts {
        position: relative;
        background-color: #f0f0f0;
        padding: 16px 32px;
        min-width: 300px;
        border-radius: 5px;
        font-family: "Roboto Mono", monospace;
        /* Digital look */
        color: #575757;
        box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.4);
      }

      #color-readouts p {
        margin: 5px 0;
        font-size: 16px;
        font-weight: 400;
      }

      @media (max-width: 820px) {
        #nav {
          flex-direction: column;
        }

        #nav-left,
        #nav-right {
          justify-content: center;
        }

        #color-readouts {
          min-width: 0;
        }
      }

      @media (max-width: 900px) {
        #saved-colors {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 660px) {
        #saved-colors {
          grid-template-columns: 1fr;
        }

        #nav-right {
          gap: 16px;
        }

        #color-readouts {
          padding: 12px 24px;
        }

        #color-readouts p {
          font-size: 14px;
        }

        :root {
          --knob-size: 40px;
        }

        .rubber-button button {
          font-size: 12px;
        }
      }

      .link-to-linepup {
        color: var(--text-color);
        font-size: 12px;
      }

      #link-to-linepup {
        position: fixed;
        bottom: 16px;
      }

      #link-to-linepup a {
        text-decoration: none;
        display: block;
        padding: 8px 16px;
        border-radius: 5px;
        background-color: rgba(00, 00, 00, 0.2);
      }

      #link-to-linepup p {
        color: var(--text-color);
        font-size: 12px;
        margin: 0;
      }
    </style>
  </head>

  <body>
    <div id="page-container">
      <div id="nav">
        <div id="nav-left">
          <div class="glow-container">
            <div id="color-readouts">
              <p>
                <span style="font-weight: 900">HEX:</span>
                <span id="hex-val">#1a1a1a</span>
              </p>
              <p>
                <span style="font-weight: 900">RGB:</span>
                <span id="rgb-val">rgb(26, 26, 26)</span>
              </p>
              <p>
                <span style="font-weight: 900">HSL:</span>
                <span id="hsl-val">hsl(0, 0%, 10%)</span>
              </p>
            </div>
          </div>
        </div>
        <div id="nav-right">
          <div id="hue-knob-container" class="knob-container">
            <div id="hue-knob" class="knob">
              <div class="pointer"></div>
            </div>
            <p id="hue-label" class="label">HUE</p>
          </div>

          <div id="saturation-knob-container" class="knob-container">
            <div id="saturation-knob" class="knob">
              <div class="pointer"></div>
            </div>
            <p id="saturation-label" class="label">SAT.</p>
          </div>

          <div id="brightness-knob-container" class="knob-container">
            <div id="brightness-knob" class="knob">
              <div class="pointer"></div>
            </div>
            <p id="brightness-label" class="label">BRIGHT.</p>
          </div>

          <div id="buttons-container">
            <div
              id="save-button-container"
              class="rubber-button white"
              onclick="saveColor()"
            >
              <button>
                <span>SAVE</span>
              </button>
            </div>

            <div
              id="clear-button-container"
              class="rubber-button red"
              onclick="clearColors()"
            >
              <button>
                <span>CLEAR</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div id="saved-colors"></div>

      <div id="link-to-linepup">
        <a href="/web/">
          <p class="link-to-linepup">
            <i
              style="font-size: 12px; margin-right: 5px"
              class="fa-solid fa-arrow-left"
              aria-hidden="true"
            ></i
            >Back to linepup.com
          </p>
        </a>
      </div>
    </div>
    <!-- END PAGE CONTAINER-->
  </body>
</html>

<script>
  const knobs = document.querySelectorAll(".knob");
  const body = document.body;

  // 1. Initial State updated to include saturation
  const knobStates = {
    "hue-knob": 0,
    "saturation-knob": 0.5, // Default to 50% saturation so it's not grey on load
    "brightness-knob": 0,
  };

  window.addEventListener("DOMContentLoaded", () => {
    knobs.forEach((knob) => {
      const savedRotation = localStorage.getItem(`${knob.id}-rotation`);
      if (savedRotation !== null) {
        const rotation = parseFloat(savedRotation);
        knob.style.transform = `rotate(${rotation}deg)`;
        knobStates[knob.id] = (rotation + 120) / 240;
      }
    });
    updateTheme();
  });

  let activeKnob = null;
  let startY = 0;
  let currentRotation = 0;

  knobs.forEach((knob) => {

    knob.addEventListener("pointerdown", (e) => {
      activeKnob = knob;
      startY = e.clientY;
      currentRotation = parseFloat(localStorage.getItem(`${knob.id}-rotation`)) || -120;
      knob.style.transition = "none";
      knob.setPointerCapture(e.pointerId);
    });
  });

  window.addEventListener("pointermove", (e) => {
    if (!activeKnob) return;

    const deltaY = startY - e.clientY;
    startY = e.clientY;

    currentRotation += deltaY * 1.5;
    currentRotation = Math.max(-120, Math.min(120, currentRotation));

    activeKnob.style.transform = `rotate(${currentRotation}deg)`;

    const intensity = (currentRotation + 120) / 240;
    knobStates[activeKnob.id] = intensity;

    updateTheme();
    localStorage.setItem(`${activeKnob.id}-rotation`, currentRotation);
  });

  window.addEventListener("pointerup", (e) => {
    if (!activeKnob) return;

    try {
      activeKnob.releasePointerCapture(e.pointerId);
    } catch {}

    activeKnob.style.transition = "transform 0.1s ease-out";
    activeKnob = null;
  });

  window.addEventListener("pointercancel", () => {
    activeKnob = null;
  });

  function updateTheme() {
    const hue = Math.round(knobStates["hue-knob"] * 360);
    const saturation = Math.round(knobStates["saturation-knob"] * 100);
    const brightness = Math.round(0 + knobStates["brightness-knob"] * 100);

    const hslString = `hsl(${hue}, ${saturation}%, ${brightness}%)`;
    body.style.setProperty("--bg-color", hslString);

    // Update the Readouts
    document.getElementById("hsl-val").innerText = hslString;

    // Get RGB from the browser's computed style
    const computedRGB = getComputedStyle(body).backgroundColor;
    document.getElementById("rgb-val").innerText = computedRGB;

    // Convert RGB to HEX
    document.getElementById("hex-val").innerText = rgbToHex(computedRGB);

    // Handle text contrast
    const textColor = brightness > 50 ? "#1a1a1a" : "#ccc";
    body.style.setProperty("--text-color", textColor);
  }

  // Helper function to convert "rgb(r, g, b)" to "#ffffff"
  function rgbToHex(rgb) {
    const rgbValues = rgb.match(/\d+/g);
    return (
      "#" +
      rgbValues
        .map((x) => {
          const hex = parseInt(x).toString(16);
          return hex.length === 1 ? "0" + hex : hex;
        })
        .join("")
    );
  }

  function saveColor() {
    let hsl = document.getElementById("hsl-val").innerText;
    let rgb = document.getElementById("rgb-val").innerText;
    let hex = document.getElementById("hex-val").innerText;

    const bodyStyles = window.getComputedStyle(body);
    let textColor = bodyStyles.color;
    const saveColorContainer = document.getElementById("saved-colors");
    saveColorContainer.style.display = "grid";
    saveColorContainer.innerHTML += `<div class="saved-color" style="background-color: ${hex}; color: ${textColor};"><p>${hex}</p><p>${rgb}</p><p>${hsl}</p></div>`;
  }

  function clearColors() {
    const saveColorContainer = document.getElementById("saved-colors");

    saveColorContainer.style.display = "none";

    saveColorContainer.innerHTML = "";
  }
</script>
